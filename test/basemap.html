<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="../KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as KRB from '../js/KRB.js';


const tileLayer = new KRB.Tile({
    texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
    attributionTitle: 'OpenStreetMap contributors',
    attributionUrl: 'https://www.openstreetmap.org/copyright',
    heightScale: 1.5,
    zoomOffset: 0,
    visible: true,
    opacity: 1,
    minZoom: 0,
    maxZoom: 18,
    minNativeZoom: 0,
    maxNativeZoom: 19,
    minElevationNativeZoom: 0,
    maxElevationNativeZoom: 15,
    crs: 'EPSG:3857',
    mask: null,
    maskInvert: false,
    maskFeather: 0
});

const map = new KRB.Map({
    target: 'map',
    layers: [tileLayer],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 8,
        maxZoom: 18
    })
});

const sampleGeoJSON = {
    "type": "Polygon",
     "coordinates": [[[37.5, 55.7], [37.7, 55.7], [37.7, 55.8], [37.5, 55.8], [37.5, 55.7]]]
};
tileLayer.setOpacity(0.5);

// tileLayer.setMask(sampleGeoJSON, { invert: false, feather: 100 });
</script>
</body>
</html>
