<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Polynomial CRS</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs('ADPKP:0057');

 const map = new KRB.Map({
        target: 'map',
        crs: 'ADPKP:0057',
        layers: [],
        graticule: {
            crs: 'EPSG:4326',
            step: 15,
            color: '#888',
            width: 1,
            opacity: 0.6,
            showLabels: true,
        },
        view: new KRB.View({
            centerLonLat: [10, 20],
            zoom: 1,
            minZoom: 0,
            maxZoom: 8,
        }),
    });


    new KRB.GeoJSONLayer({
        url: 'world.geojson',
        defaultFillColor:   '#3b82f6',
        defaultFillOpacity: 0.28,
        defaultStrokeColor: '#1e3a8a',
        defaultStrokeWidth: 0.7,
    }).addTo(map);

</script>
</body>
</html>
