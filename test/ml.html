<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>MapLibre Globe</title>
    <!-- ВАЖНО: мажорная версия 5, в 4.x глобуса нет -->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        body { margin: 0; background: #0b1026; } /* "космос" вокруг глобуса */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {},
                layers: [{
                    id: 'background',
                    type: 'background',
                    paint: { 'background-color': '#aadaff' } // "океан"
                }]
            },
            center: [30, 30],
            zoom: 1.5
        });

        // Проекция глобуса включается после загрузки стиля
        map.on('style.load', () => {
            map.setProjection({ type: 'globe' });
        });

        map.on('load', () => {
            map.addSource('world', {
                type: 'geojson',
                data: 'world.geojson'
            });

            map.addLayer({
                id: 'world-fill',
                type: 'fill',
                source: 'world',
                paint: {
                    'fill-color': '#2ca25f',
                    'fill-opacity': 0.8
                }
            });

            map.addLayer({
                id: 'world-line',
                type: 'line',
                source: 'world',
                paint: {
                    'line-color': '#14532d',
                    'line-width': 0.5
                }
            });
        });

        map.addControl(new maplibregl.NavigationControl());
    </script>
</body>
</html>
