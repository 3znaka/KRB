<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="https://3znaka.github.io/KRB/KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as KRB from 'https://3znaka.github.io/KRB/js/KRB.js';

const map = new KRB.Map({
    target: 'map',
    layers: [
        new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/'
        })
    ],
    view: new KRB.View({
        center: KRB.proj.fromLonLat([37.6178, 55.7558]),
        zoom: 8
    }),
    heightScale: 2.0,
    maxZoom: 18
});
    

    

</script>
</body>
</html>
