<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Polynomial CRS — debug occluder</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
    #debug {
        position: absolute; top: 8px; left: 8px; z-index: 9999;
        background: rgba(255,255,255,0.95); color: #111;
        font: 12px/1.4 monospace; padding: 8px 10px; border: 1px solid #999;
        border-radius: 4px; max-width: 520px; max-height: 60vh; overflow: auto;
        white-space: pre;
    }
</style>
</head>
<body>
<div id="map"></div>
<div id="debug">загрузка…</div>

<script type="module">
import * as KRB from '../js/KRB.js';

const out = document.getElementById('debug');
const log = [];
const print = (s) => { log.push(s); out.textContent = log.join('\n'); };

await KRB.addCrs(['ADPKP:0072', 'EPSG:32637', 'EPSG:32601']);

const map = new KRB.Map({
    target: 'map',
    debug: true,
    globe: true,
    layers: [],
    view: new KRB.View({
        centerLonLat: [10, 20],
        zoom: 1,
        minZoom: 0,
        maxZoom: 8,
    }),
});

const world = new KRB.GeoJSONLayer({
    url: 'lines.geojson',
    defaultFillColor:   '#aa0101',
    defaultStrokeColor: '#000000',
    defaultStrokeWidth: 0.3,
}).addTo(map);

window.map = map;
window.world = world;

// ---- отчёт: окклюдер и флаги полилиний ----
function collectPolylines() {
    const found = [];
    const walk = (node, depth = 0) => {
        if (!node || depth > 6) return;
        const list = node._objects || node.objects || node.children;
        if (!Array.isArray(list)) return;
        for (const o of list) {
            if (o && typeof o.getDepthTest === 'function' && o._material) found.push(o);
            walk(o, depth + 1);
        }
    };
    walk(world);
    return found;
}

function report() {
    log.length = 0;

    // 1) окклюдер на карте
    const occ = map._globeOccluder;
    print('== OCCLUDER ==');
    print(`globe flag        : ${map.globe}`);
    print(`surface class     : ${map.surface?.constructor?.name}`);
    print(`occluder exists   : ${!!occ}`);
    if (occ) {
        print(`occluder visible  : ${occ.visible}`);
        print(`occluder inScene  : ${!!occ.parent}`);
        print(`occluder renderOrder: ${occ.renderOrder}`);
        print(`occluder depthWrite: ${occ.material?.depthWrite}`);
        print(`occluder colorWrite: ${occ.material?.colorWrite}`);
        print(`occluder scale    : ${occ.scale?.x?.toFixed?.(2)}`);
    }

    // 2) полилинии
    const lines = collectPolylines();
    print('');
    print(`== POLYLINES (${lines.length}) ==`);
    const shown = lines.slice(0, 5);
    for (const pl of shown) {
        const m = pl._material;
        print(`depthTest=${m?.depthTest}  depthWrite=${m?.depthWrite}  ` +
              `renderOrder=${pl._line?.renderOrder}  explicit=${pl._depthFlagsExplicit}`);
    }
    if (lines.length > shown.length) print(`… и ещё ${lines.length - shown.length}`);

    // 3) вердикт
    print('');
    const okOcc = !!occ && occ.visible && !!occ.parent;
    const okDepth = lines.length > 0 && lines.every(pl => pl._material?.depthTest === true);
    print('== ВЕРДИКТ ==');
    if (!okOcc) print('✗ окклюдера нет или он не в сцене → проблема в WorldSurface/Core');
    else if (!okDepth) print('✗ depthTest выключен у линий → флаги не применились (старый KRB.js?)');
    else print('✓ окклюдер в сцене, depthTest включён → искать причину в шейдере LineMaterial');
}

// линии появляются асинхронно — опрашиваем до появления, затем отчёт
let tries = 0;
const timer = setInterval(() => {
    tries++;
    const n = collectPolylines().length;
    if (n > 0 || tries > 40) {
        clearInterval(timer);
        report();
    } else {
        print(`ожидание полилиний… (${tries})`);
    }
}, 250);
</script>
</body>
</html>
