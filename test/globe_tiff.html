<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Geotiff</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

const tiles =  new KRB.Tile({
            texture: 'https://www.google.com/maps/vt?lyrs=s@180&gl=cn&x={x}&y={y}&z={z}',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/',
          //  elevation: 'demo',
          extendAntarctica: true,
            maxZoom: 18
        });



const map = new KRB.Map({
    target: 'map',
 globe: true,
    layers: [
     tiles,
    ],
graticule: { crs: 'EPSG:4326', step: 15, color: '#888', width: 1 } ,
    view: new KRB.View({
       centerLonLat: [37.6178, 55.7558],
        zoom: 8,
        maxZoom: 18
    }),
    debug:true,
});


const img2 = new KRB.Image({
    source: 'horse.png',
    title: 'лошадь',
    position: [37.6178, 55.7558, 100],
    size: [40000, 40000],
});
//img2.addTo(map);

 

</script>
</body>
</html>
