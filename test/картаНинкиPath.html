<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../KRB.css">
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100dvh; position: relative; }
    #menu {
        position: absolute;
        z-index: 1000;
        top: 10px; left: 10px;
        width: 300px;
        max-height: calc(100dvh - 20px);
        overflow-y: auto;
        background: rgba(255,255,255,0.92);
        padding: 12px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        font-size: 13px;
    }
    fieldset {
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 0 0 10px 0;
        padding: 8px 10px 10px;
    }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    label > span { flex: 0 0 90px; }
    input[type=number], select { flex: 1; padding: 2px 4px; }
    button { padding: 4px 8px; cursor: pointer; }
    .row { display: flex; gap: 4px; flex-wrap: wrap; }
    #carList { font-family: ui-monospace, monospace; font-size: 11px; }
    .car-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 0;
        border-bottom: 1px solid #eee;
    }
    .car-row input[type=color] {
        width: 22px; height: 22px; padding: 0; border: none; cursor: pointer;
    }
    .car-row .info { flex: 1; }
  </style>
</head>
<body>
  <div id="menu">
    <fieldset>
      <legend>Маршруты</legend>
      <div class="row">
        <button data-filter="2023-07-08">08.07</button>
        <button data-filter="2023-07-09">09.07</button>
        <button data-filter="">Все</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Новая машинка</legend>
      <label><span>Цвет</span>
        <input type="color" id="newColor" value="#ff6600">
      </label>
      <label><span>Задать по</span>
        <select id="newMode">
          <option value="duration">времени</option>
          <option value="speed">скорости</option>
        </select>
      </label>
      <label><span id="newValueLabel">Время (с)</span>
        <input type="number" id="newValue" value="30" min="1">
      </label>
      <label><span>Направление</span>
        <select id="newDir">
          <option value="fwd">→ вперёд</option>
          <option value="bwd">← назад</option>
        </select>
      </label>
      <label><span>Цикл</span>
        <select id="newLoop">
          <option value="restart">перезапуск</option>
          <option value="pingpong">пинг-понг</option>
          <option value="none">один раз</option>
        </select>
      </label>
      <label><span>Старт с</span>
        <input type="range" id="newStart" min="0" max="100" value="0" style="flex:1">
        <span id="newStartVal" style="flex:0 0 40px; text-align:right">0%</span>
      </label>
      <button id="btnAdd" style="margin-top:6px; width:100%">➕ Добавить машинку</button>
    </fieldset>

    <fieldset>
      <legend>Управление</legend>
      <div class="row">
        <button id="btnPause">⏸ Пауза</button>
        <button id="btnResume">▶ Продолжить</button>
        <button id="btnStop">⏹ Стоп</button>
        <button id="btnClear" title="Удалить все машинки">🗑 Очистить</button>
      </div>
      <label><span>Скорость</span>
        <input type="range" id="globalSpeed" min="10" max="500" value="100" style="flex:1">
        <span id="globalSpeedVal" style="flex:0 0 50px; text-align:right">100</span>
      </label>
    </fieldset>

    <fieldset>
      <legend>Машинки: <span id="carCount">0</span></legend>
      <div id="carList"></div>
    </fieldset>
  </div>

// =====================================================================
// Маршруты + машины
// =====================================================================

const vectors = [];  // Vector3D, которые сейчас на карте
const cars = [];     // { id, follower, vector, color, opts, cardEl, infoEl }
let carIdCounter = 0;

const layer2 = new KRB.GeoJSONLayer({
    data: data_route,
    defaultVectorWidth: 5,
    defaultVectorArrowSize: 22,
    defaultVectorAltitudeMode: 'clampToGround',
    defaultVectorAltitude: 2,

    style: {
        vector: {
            default: {
                titleStyle: {
                    color: '#fff',
                    backgroundColor: '{color}',
                    padding: '2px 8px',
                    borderRadius: '3px',
                    fontSize: '13px',
                },
            },
        },
    },

    onEachFeature: (feature, vector) => {
        vectors.push(vector);
        const color = feature.properties?.color ?? '#3388ff';

        // Дефолтная машинка на маршрут — как старый movingArrow,
        // но теперь полностью управляемая.
        const entry = spawnCar(vector, {
            color,
            duration: 30,
            direction: 1,
            loop: 'restart',
        });

        // Слой пересобрался (фильтр) → Vector3D уходит,
        // PathFollower сам удалится через onPathDestroy,
        // нам остаётся почистить свою книгу учёта.
        vector.onPathDestroy(() => {
            const i = vectors.indexOf(vector);
            if (i >= 0) vectors.splice(i, 1);
            for (let j = cars.length - 1; j >= 0; j--) {
                if (cars[j].vector === vector) {
                    cars[j].cardEl.remove();
                    cars.splice(j, 1);
                }
            }
            updateCarCount();
        });
    },
}).addTo(map);


// =====================================================================
// Хелперы
// =====================================================================

function spawnCar(vector, opts) {
    const id = ++carIdCounter;

    const follower = new KRB.PathFollower({
        path: vector,
        visual: KRB.createPrimitiveVisual({
            primitiveType: 'cone',
            color: opts.color,          // ← opts.color, не color
            depthTest: false,
        }),
        size: 24,
        sizeMode: 'px',
        alignToPath: true,
        forwardAxis: 'y',
        altitudeOffset: 3,
        tooltip: `Машинка #${id}`,
        title: `#${id}`,
        titleStyle: { color: '#fff', fontSize: '11px' },
        titleVerticalAlign: 'bottom',
    });
    follower.addTo(map);

    // ── движение ──
    const applyMove = () => {
        const s = opts.startFrac ?? 0;
        const from = opts.direction > 0 ? s : (1 - s);
        const to   = opts.direction > 0 ? 1 : 0;
        const spec = { from, to, loop: opts.loop };
        if (opts.duration != null) spec.duration = opts.duration;
        else                       spec.speed = { kmh: opts.speedKmh ?? 60 };
        follower.moveTo(spec);
    };
    applyMove();

    // ── карточка ──
    const cardEl = document.createElement('div');
    cardEl.className = 'car-row';

    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = opts.color;      // ← opts.color, не color
    colorInput.title = 'Изменить цвет';
    colorInput.onchange = () => {
        opts.color = colorInput.value;
        follower.setVisual(KRB.createPrimitiveVisual({
            primitiveType: 'cone',
            color: opts.color,          // ← opts.color
            depthTest: false,
        }));
    };

    const infoEl = document.createElement('span');
    infoEl.className = 'info';

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.title = 'Удалить';
    removeBtn.style.padding = '0 4px';

    cardEl.append(colorInput, infoEl, removeBtn);
    document.getElementById('carList').appendChild(cardEl);

    const entry = {
        id,
        follower,
        vector,
        color: opts.color,              // ← opts.color
        opts,
        cardEl,
        infoEl,
    };
    removeBtn.onclick = () => removeCar(entry);
    cars.push(entry);
    updateCarCount();


setTimeout(() => {
    const f = cars[0]?.follower;
    if (!f) return;
    const root = f['_visualRoot'];
    console.log('[debug]', {
        groupVisible: f['_group']?.visible,
        groupInWorld: f['_group']?.parent === map.worldGroup,
        groupPos: f['_group']?.position.clone(),
        groupQuat: f['_group']?.quaternion.clone(),
        rootVisible: root?.visible,
        rootScale: root?.scale.clone(),
        rootPos: root?.position.clone(),
        rootMaterialColor: root?.material?.color?.getHexString?.(),
        rootMaterialType: root?.material?.type,
        cameraPos: map.camera.position.clone(),
        pathLength: f.getTotalPathLength(),
        progress: f.getProgress(),
    });
}, 1500);

    return entry;
}

function removeCar(entry) {
    const i = cars.indexOf(entry);
    if (i < 0) return;
    cars.splice(i, 1);
    entry.follower.remove();
    entry.cardEl.remove();
    updateCarCount();
}

function updateCarCount() {
    document.getElementById('carCount').textContent = cars.length;
}


// =====================================================================
// UI: добавление
// =====================================================================

const $ = (id) => document.getElementById(id);

$('newMode').onchange = (e) => {
    const label = $('newValueLabel');
    const input = $('newValue');
    if (e.target.value === 'speed') {
        label.textContent = 'Скорость (км/ч)';
        input.value = '100';
    } else {
        label.textContent = 'Время (с)';
        input.value = '30';
    }
};

$('newStart').oninput = () => { $('newStartVal').textContent = $('newStart').value + '%'; };

$('btnAdd').onclick = () => {
    if (vectors.length === 0) {
        alert('Нет видимых маршрутов. Сначала выберите маршрут.');
        return;
    }
    const color = $('newColor').value;
    const mode  = $('newMode').value;
    const value = parseFloat($('newValue').value);
    const dir   = $('newDir').value === 'fwd' ? 1 : -1;
    const loop  = $('newLoop').value;
    const start = (parseFloat($('newStart').value) || 0) / 100;

    const opts = { color, direction: dir, loop, startFrac: start };
    if (mode === 'speed') opts.speedKmh = value;
    else                  opts.duration = value;

    spawnCar(vectors[0], opts);  // добавим на первый видимый маршрут
};


// =====================================================================
// UI: глобальное управление
// =====================================================================

$('btnPause').onclick  = () => cars.forEach(c => c.follower.pause());
$('btnResume').onclick = () => cars.forEach(c => c.follower.play());
$('btnStop').onclick   = () => cars.forEach(c => c.follower.stop());
$('btnClear').onclick  = () => { for (const c of [...cars]) removeCar(c); };

$('globalSpeed').oninput = () => { $('globalSpeedVal').textContent = $('globalSpeed').value; };
$('globalSpeed').onchange = () => {
    const kmh = parseFloat($('globalSpeed').value);
    // setSpeed сохраняет текущую позицию, пересчитывает длительность
    for (const c of cars) {
        c.follower.setSpeed({ kmh });
        c.opts.speedKmh = kmh;
        c.opts.duration = null;
    }
};

// UI: фильтры
// =====================================================================

document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.onclick = () => layer2.setFilter(btn.dataset.filter || '');
});

// Живой прогресс
// =====================================================================

setInterval(() => {
    for (const entry of cars) {
        const p = entry.follower.getProgress();
        const state = p.isPaused ? '⏸' : (p.isPlaying ? '▶' : '⏹');
        const pct   = (p.fraction * 100).toFixed(0);
        const kmh   = (p.speed * 3.6).toFixed(0);
        const rem   = p.remainingDistance.toFixed(0);
        entry.infoEl.textContent =
            `#${entry.id} ${state} ${pct}% · ${kmh} км/ч · −${rem}м`;
    }
}, 250);
  </script>
</body>
</html>
