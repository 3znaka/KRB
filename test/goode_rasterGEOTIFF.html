<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Polynomial CRS</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';
const { Projections, ELLIPSOIDS } = await import('./../js/Projections.js');

await KRB.addCrs(['ESRI:54052']);

const map = new KRB.Map({
    target: 'map',
  crs: 'ESRI:54052',
        layers: [],
        graticule: {
            crs: 'EPSG:4326',
            step: { lat: 5, lon: 5 },
            color: '#888',
            width: 1,
            opacity: 0.6,
            showLabels: true,
        },
        view: new KRB.View({
            centerLonLat: [10, 20],
            zoom: 1,
            minZoom: 0,
            maxZoom: 8,
        }),
    });


const rastr = new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/',
        }).addTo(map);


 const adm = {
    "type": "Feature",
    "properties": {
    },
    "geometry": {
        "type": "Polygon",
        "coordinates": [ [
            [ 31.5, 52.5 ],
            [ 46.0, 52.5 ],
            [ 46.0, 57.5 ],
            [ 31.5, 57.5 ],
            [ 31.5, 52.5 ]
        ] ]
    }
};       

const tiff = new KRB.GeoTiffLayer({
    source: 'tempworld.tif',
    colorRamp: 'terrain',
    mask: adm,
    opacity: 0.75,
}).addTo(map);

tiff.clearMask();



</script>
</body>
</html>
