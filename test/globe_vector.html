<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Geotiff</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.crs.add('EPSG:32637');

// DEBUG: ?onlypolar=1 — рисовать только полюсные заливки (тест источника белого круга).
globalThis.DEBUG_ONLY_POLAR = new URLSearchParams(location.search).get('onlypolar') === '1';
// DEBUG: ?nopolar=1 — без полюсных полос (проверка, даёт ли круг сама заливка тайла).
globalThis.DEBUG_NO_POLAR_STRIP = new URLSearchParams(location.search).get('nopolar') === '1';
console.log('[debug] DEBUG_NO_POLAR_STRIP =', globalThis.DEBUG_NO_POLAR_STRIP);
console.log('[debug] DEBUG_ONLY_POLAR =', globalThis.DEBUG_ONLY_POLAR);

const tiles =  new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/',
          //  elevation: 'demo',
            maxZoom: 18
        });

        const vectorLayer = new KRB.VectorTile({
    url: 'https://storage.mwsapis.ru/b-winzaf/pbf/{z}/{x}/{y}.pbf',
    maxNativeZoom: 14,
                    zoomOffset: -2
});



const map = new KRB.Map({
    target: 'map',
globe: true,
    layers: [
     vectorLayer,
    ],
// graticule: { crs: 'EPSG:4326', step: 15, color: '#888', width: 1 } ,
    view: new KRB.View({
       centerLonLat: [37.6178, 55.7558],
        zoom: 2,
        maxZoom: 18
    }),
    debug:true,
});


</script>
</body>
</html>
