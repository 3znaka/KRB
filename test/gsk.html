<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Diagram — Локализованные диаграммы</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #map { position: absolute; inset: 0; width: 100%; height: 100dvh; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.crs.add(['EPSG:7682', 'EPSG:4284', 'EPSG:4200']);

const map = new KRB.Map({
    target: 'map',
    globe: true,
    layers: [
        new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/'
        })
    ],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 11,
        maxZoom: 35
    })

});


new KRB.Marker({
    position: [37.6178, 55.7558],
    tooltip: '<b>Москва</b><br><small>столица России</small>',
    title: 'Москва',
    titleStyle: { color: '#fff', textShadow: '0 1px 3px #000', fontSize: '13px', fontWeight: 'bold' }
}).addTo(map);


new KRB.Marker({
    crs: 'EPSG:4200',
    position: [37.6178, 55.7558],
    tooltip: '<b>Москва</b><br><small>столица России</small>',
    title: 'Москва СК-95',
    titleStyle: { color: '#fff', textShadow: '0 1px 3px #000', fontSize: '13px', fontWeight: 'bold' }
}).addTo(map);

new KRB.Marker({
    crs: 'EPSG:7682',
    position: [37.6178, 55.7558],
    tooltip: '<b>Москва</b><br><small>столица России</small>',
    title: 'Москва ГСК',
    titleStyle: { color: '#fff', textShadow: '0 1px 3px #000', fontSize: '13px', fontWeight: 'bold' }
}).addTo(map);


new KRB.Marker({
    crs: 'EPSG:4284',
    position: [37.6178, 55.7558],
    tooltip: '<b>Москва</b><br><small>столица России</small>',
    title: 'Москва СК-42',
    titleStyle: { color: '#fff', textShadow: '0 1px 3px #000', fontSize: '13px', fontWeight: 'bold' }
}).addTo(map);





</script>
</body>
</html>
