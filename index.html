<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="https://raw.githubusercontent.com/3znaka/KRB/refs/heads/main/KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; font-family: sans-serif; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
        .info-panel {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(255, 255, 255, 0.9); padding: 10px 15px;
            border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="info-panel">
    <b>Мониторинг фосфатов (KRB Engine)</b><br>
    <span style="color: #e74c3c;">■</span> Превышение ПДК (AvgPDK > 1)<br>
    <span style="color: #2ecc71;">■</span> В пределах нормы
</div>

<script type="module">
import * as KRB from 'https://raw.githubusercontent.com/3znaka/KRB/refs/heads/main/js/KRB.js';

// Инициализация карты KRB
const map = new KRB.Map({
    target: 'map',
    layers: [
        new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/'
        })
    ],
    view: new KRB.View({
        // Центрируем на район Плещеева озера и Переславля-Залесского
        center: KRB.proj.fromLonLat([38.81, 56.76]), 
        zoom: 11,
        maxZoom: 24
    }),
    heightScale: 2.0,
});

// Загружаем ваш GeoJSON файл
fetch('./fosfats.geojson')
    .then(response => response.json())
    .then(geojsonData => {
        
        // Фильтруем данные: оставляем только последние годы (2024 и 2025), 
        // чтобы столбики за разные годы не накладывались друг на друга в одной точке.
        // Если движок поддерживает временные слайсеры, этот фильтр можно убрать.
        const recentFeatures = geojsonData.features.filter(f => f.properties.Year >= 2024);
        
        const displayData = {
            type: 'FeatureCollection',
            features: recentFeatures
        };

        // Создаём слой с 3D-маркерами
        const geoLayer = new KRB.GeoJSONLayer({
            data: displayData,
            point3DToOptions: (feature, props) => {
                // Берем среднее значение в ПДК (AvgPDK) для расчета высоты
                // Умножаем на 150, чтобы столбики были хорошо видны в 3D-пространстве
                const pdks = props.AvgPDK || 0;
                const height = Math.max(20, pdks * 150); 
                
                // Логика цвета: красный если среднее превышает 1 ПДК, зеленый если нет
                const color = pdks > 1.0 ? '#e74c3c' : '#2ecc71';

                return {
                    primitiveType: 'box',
                    size: [60, height, 60],         // Основание 60x60, высота динамическая
                    anchor: [0.5, 0, 0.5],          // "Приклеиваем" основание к земле
                    altitude: 0,
                    altitudeMode: 'clampToGround',
                    color: color,
                    minZoom: 9,
                    maxZoom: 24,
                    title: `${props.Name} (${props.Year})`,
                    // В тултип выводим подробную химию
                    tooltip: `
                        <b>${props.Name}</b><br>
                        Год: <b>${props.Year}</b><br>
                        Среднее ПДК: <b>${pdks.toFixed(2)}</b><br>
                        Макс. значение: ${props.Max} мг/л<br>
                        Точка №: ${props.Point}
                    `
                };
            }
        });

        geoLayer.addTo(map);
    })
    .catch(err => {
        console.error('Ошибка загрузки fosfats.geojson. Убедитесь, что файл лежит рядом с HTML.', err);
    });

</script>
</body>
</html>
