<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Diagram — 3D Локализованные диаграммы</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #map { position: absolute; inset: 0; width: 100%; height: 100dvh; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs(['ADPKP:0057']);

const map = new KRB.Map({
    target: 'map',
    crs: 'ADPKP:0057',
    graticule: { crs: 'EPSG:4326', step: 15, color: '#888', width: 1 },
    view: new KRB.View({
        centerLonLat: [10, 20],
        zoom: 3, minZoom: 0, maxZoom: 12,
    }),
});

// ─────────────────────────────────────────────────────────────────
// СЛОЙ 1: Полигоны с картограммой (Choropleth)
// ─────────────────────────────────────────────────────────────────
new KRB.GeoJSONLayer({
    url: 'world.geojson',
    crs: 'EPSG:4326',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Население: ${p.pop}`,
    
    style: { polygon: { default: { title: '' } } },

    choropleth: {
        value: 'pop', 
        colorRamp: 'terrain',          
        classification: 'jenks',    
        classes: 10,                 
        noDataColor: '#cccccc'    
    },
    
    defaultFillOpacity: 0.6,
    defaultStrokeColor: '#333',
    defaultStrokeWidth: 0.5,
}).addTo(map);


// ─────────────────────────────────────────────────────────────────
// СЛОЙ 2: Точки с 3D локализованными диаграммами (по 1 точке на город)
// ─────────────────────────────────────────────────────────────────

const cities = [
    { name: 'Москва',    lon:  37.61, lat:  55.75 },
    { name: 'Лондон',    lon:  -0.12, lat:  51.50 },
    { name: 'Нью-Йорк',  lon: -74.00, lat:  40.71 },
    { name: 'Токио',     lon: 139.69, lat:  35.68 },
    { name: 'Сидней',    lon: 151.20, lat: -33.86 },
    { name: 'Каир',      lon:  31.23, lat:  30.04 },
    { name: 'Рио',       lon: -43.17, lat: -22.90 },
    { name: 'Кейптаун',  lon:  18.42, lat: -33.92 },
    { name: 'Дели',      lon:  77.20, lat:  28.61 },
    { name: 'Пекин',     lon: 116.40, lat:  39.90 },
];

// Одна точка ровно в центре каждого города
const pointsFeatures = cities.map(c => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [c.lon, c.lat] },
    properties: {
        name: c.name,
        score: Math.floor(Math.random() * 50) + 1,
        value: Math.floor(Math.random() * 30) + 1,
        count: Math.floor(Math.random() * 100) + 1
    }
}));

const pointsFC = { type: 'FeatureCollection', features: pointsFeatures };

new KRB.GeoJSONLayer({
    data: pointsFC,
    crs: 'EPSG:4326',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Score: ${p.score}<br>Value: ${p.value}`,
diagram3D: {
    type: 'circle3d', // или 'vienna3d'
    fields: ['score', 'value', 'count'],
    unitM: 400000,      // Размер одного маленького кубика (5 км)
    unitValue: 3,    // 1 кубик = 10 единиц значения
    gapM: 500,        // Отступ между кубиками
    maxCols: 5,       // Работает только для 'vienna3d'
    strokeColor: '#ffffff',
    minZoom: 2,
}
}).addTo(map);

</script>
</body>
</html>
