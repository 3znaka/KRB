<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="/KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #hui { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="hui"></div>
<script type="module">
import * as KRB from '/js/KRB.js';

 await KRB.Projections.ensure('EPSG:32637');
  await KRB.Projections.ensure('EPSG:8857');

const KRBmap = new KRB.Map({
    target: 'hui',
            crs: 'EPSG:8857',
    layers: [
new KRB.VectorTile({
            url: 'https://storage.mwsapis.ru/b-winzaf/pbf/{z}/{x}/{y}.pbf',
            maxNativeZoom: 14,
            minZoom: 2,
            maxZoom: 24,

            zoomOffset: 0,
            debug: true,
          
        }),
    ],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 8,
        maxZoom: 18
    })
});



const marker = new KRB.Marker({
    position: [413500, 6178000],
    crs: 'EPSG:32637',
    title: 'UTM-точка'
});
marker.addTo(KRBmap);

window.KRBmap = KRBmap;
</script>
</body>
</html>
