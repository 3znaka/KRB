<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Diagram — простой пример</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; width: 100%; height: 100dvh; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs(['ADPKP:0057']);

const map = new KRB.Map({
    target: 'map',
    crs: 'ADPKP:0057',
    graticule: { crs: 'EPSG:4326', step: 15, color: '#888', width: 1 },
    view: new KRB.View({
        centerLonLat: [10, 20],
        zoom: 2, minZoom: 0, maxZoom: 8,
    }),
});

new KRB.GeoJSONLayer({
    url: 'world.geojson',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Score: ${p.score}`,

  fillCOlor: 'score',

  diagram: {
        type: 'bar',
         fields: ['score', 'value'], 
        colorMap: { 
            score: '#2ecc71', 
            value: '#3498db' // зададим цвет и для второго поля
        },
        colorMap: { score: '#2ecc71' },
        
        unitPx: 0.3,             // Масштаб: 1 единица score = 0.3 px высоты
        barWidth: 16,            // Ширина столбика
        segmentSizes: [100, 50, 10], // Разбиваем на номиналы: сотни, полтины, десятки
        
        orientation: 'vertical', // (по умолчанию) или 'horizontal'
        strokeColor: '#111',
        strokeWidth: 1,
        minZoom: 2,
    },
}).addTo(map);


      
</script>
</body>
</html>
