<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="../KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as KRB from '../js/KRB.js';


const map = new KRB.Map({
    target: 'map',
globe:true,
    layers: [],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 12,
        maxZoom: 22
    }),

});

//map.moveCameraTo(37.6178, 55.7558);
map.easeTo({center: [37.6178, 56.7558], duration: 1, zoom: 2, pitch:45});

const vectorLayer = new KRB.VectorTile({
    url: 'https://storage.mwsapis.ru/b-winzaf/pbf/{z}/{x}/{y}.pbf',
    maxNativeZoom: 14,
                    zoomOffset: -2
}).addTo(map);

const myModel = new KRB.Area3D({
    modelUrl: 'model.glb',
     rings: [[
        [37.60, 55.75],
        [37.64, 55.75],
        [37.64, 55.78],
        [37.60, 55.78]
    ]],
    size: 200,                   
    altitude: 0,
    altitudeMode: 'clampToGround',
    anchor: [0.5, 0, 0.5],
    onHover: (hovered) => {
        if (hovered) {
            myModel.setSize(700);
        } else {
            myModel.setSize(200);
        }
    }
});
myModel.addTo(map);


</script>
</body>
</html>
