<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
   <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
    
<title>Diagram — простой пример</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; overflow:hidden; }
    #map { position: absolute; inset: 0; width: 100%; height: 100dvh; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs(['ADPKP:0057']);

// 1. Создаем сетку явно
const graticule = new KRB.Graticule({ 
    crs: 'EPSG:4326', 
    step: 15, 
    color: '#888', 
    width: 1 
});

// 2. Передаем её в карту
const map = new KRB.Map({
    target: 'map',
    crs: 'ADPKP:0057',
    graticule: graticule, // передаем экземпляр
    view: new KRB.View({
        centerLonLat: [10, 20],
        zoom: 2, minZoom: 0, maxZoom: 8,
    }),
});

new KRB.GeoJSONLayer({
    url: 'world.geojson',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Score: ${p.score}`,
    label: '',
    style: { polygon: { default: { title: '' } }},
    choropleth: {
        value: 'pop', 
        colorRamp: 'terrain',          
        classification: 'jenks',    
        classes: 10,                 
        noDataColor: '#cccccc'    
    },
    diagram: {
        type: 'vienna',
        fields: ['score'], 
        colorMap: { score: [{ max: 300, color: '#e74c3c' }, { color: '#2ecc71' }] },
        gap: -1,
        unitPx: 5,      
        unitValue: 50,   
        strokeColor: '#111',
        strokeWidth: 1,
        minZoom: 0,
    },
}).addTo(map);

// 3. Сохраняем для консоли
window.map = map;
window.graticule = graticule;
console.log("Готово! Экземпляры в window.map и window.graticule");
</script>
</body>
</html>
