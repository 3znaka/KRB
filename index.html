<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="/KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as KRB from '/js/KRB.js';


const map = new KRB.Map({
    target: 'map',
    layers: [
        new KRB.VectorTile({
            url: 'https://storage.mwsapis.ru/b-winzaf/pbf/{z}/{x}/{y}.pbf',
            maxNativeZoom: 14,
            minZoom: 2,
            maxZoom: 24,
            zoomOffset: -2,
            debug: true,
          
        }),
    ],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 12,
        maxZoom: 20,
    }),
});



map.moveCameraTo(37.6178, 55.7558);

window.krbMap = map;
</script>
</body>
</html>
