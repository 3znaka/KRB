<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Test: formula CRS</title>
    <link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
       #map { position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    height: 100dvh; overflow:hidden;}
    #ui {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        background: rgba(255,255,255,.92); padding: 10px 12px;
        border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
        font-size: 13px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        max-width: 380px;
    }
    #ui button { margin: 3px 2px; padding: 4px 10px; cursor: pointer; }
    #ui button.active { background: #3b82f6; color: #fff; border-color: #1d4ed8; }
    #status { margin-top: 6px; color: #475569; font-size: 12px; max-width: 340px; }

    .custom-panel {
        border-top: 1px solid #cbd5e1;
        margin-top: 8px; padding-top: 8px;
    }
    .custom-panel h4 {
        margin: 0 0 4px 0; font-size: 12px; color: #1e293b;
    }
    .custom-panel .hint {
        font-size: 10px; color: #64748b; margin-bottom: 4px;
        font-family: ui-monospace, monospace;
    }
    .custom-panel label {
        display: block; font-size: 11px; color: #334155; margin-top: 6px;
    }
    .custom-panel textarea {
        width: 100%; box-sizing: border-box;
        height: 56px;
        font-family: ui-monospace, monospace; font-size: 11px;
        padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px;
        resize: vertical;
    }
    .custom-panel input[type=number] {
        width: 100px; padding: 2px 4px; font-size: 11px;
        border: 1px solid #cbd5e1; border-radius: 4px;
    }
    .custom-panel .row { display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="ui">
    <div><b>CRS:</b></div>
    <button data-crs="EPSG:3857">Mercator</button>
    <button data-crs="TEST:EQC">Equirectangular</button>
    <button data-crs="TEST:EE">Equal Earth</button>
    <button data-crs="TEST:POLY">Polynomial</button>
    <button data-crs="TEST:CUSTOM">Custom</button>
    <div id="status">загрузка…</div>

    <div class="custom-panel">
        <h4>Пользовательская проекция</h4>
        <div class="hint">Доступно: lat, lon, x, y, R, D2R, R2D, PI, HALF_PI</div>

        <label>Forward: (lat, lon) → [x, y]</label>
        <textarea id="fwd-formula">[lon, lat]</textarea>

        <label>Inverse: (x, y) → [lat, lon]</label>
        <textarea id="inv-formula">[y, x]</textarea>

        <div class="row">
            <label>halfExtentX
                <input id="he-x" type="number" step="any" value="180">
            </label>
            <label>halfExtentY
                <input id="he-y" type="number" step="any" value="90">
            </label>
        </div>
    </div>
</div>

<script type="module">
import * as KRB from '../js/KRB.js';

// ─────────────────────────────────────────────────────────────────────
// 1. РЕГИСТРАЦИЯ ФОРМУЛЬНЫХ ПРОЕКЦИЙ
// ─────────────────────────────────────────────────────────────────────
const R   = 6378137;
const D2R = Math.PI / 180;
const R2D = 180 / Math.PI;

// ── Equirectangular (plate carrée) ──────────────────────────────────
KRB.Projections.registerFormula('TEST:EQC', [
    (lat, lon) => R * lon * D2R,
    (lat, lon) => R * lat * D2R,
    (x, y)     => y / R * R2D,
    (x, y)     => x / R * R2D,
], {
    semiMajor:   R,
    halfExtentX: R * Math.PI,
    halfExtentY: R * Math.PI / 2,
});

// ── Equal Earth (Šavrič et al., 2018) ──────────────────────────────
const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
const M  = Math.sqrt(3) / 2;
const S3 = Math.sqrt(3);

function eeX(lat, lon) {
    const phi   = lat * D2R, lam = lon * D2R;
    const theta = Math.asin(M * Math.sin(phi));
    const t2 = theta * theta, t6 = t2 * t2 * t2;
    const denom = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
    return R * 2 * S3 * lam * Math.cos(theta) / (3 * denom);
}
function eeY(lat, lon) {
    const phi   = lat * D2R;
    const theta = Math.asin(M * Math.sin(phi));
    const t2 = theta * theta, t6 = t2 * t2 * t2;
    return R * theta * (A1 + A2 * t2 + t6 * (A3 + A4 * t2));
}
function solveTheta(yp) {
    let th = yp;
    for (let i = 0; i < 12; i++) {
        const t2 = th * th, t6 = t2 * t2 * t2;
        const f  = th * (A1 + A2 * t2 + t6 * (A3 + A4 * t2)) - yp;
        const fp = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
        const d  = f / fp;
        th -= d;
        if (Math.abs(d) < 1e-12) break;
    }
    return th;
}
function eeInvLat(x, y) {
    const th = solveTheta(y / R);
    return Math.asin(Math.sin(th) / M) * R2D;
}
function eeInvLon(x, y) {
    const th = solveTheta(y / R);
    const t2 = th * th, t6 = t2 * t2 * t2;
    const denom = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
    return (x * 3 * denom / (2 * S3 * Math.cos(th) * R)) * R2D;
}

KRB.Projections.registerFormula('TEST:EE', [
    eeX, eeY, eeInvLat, eeInvLon,
], {
    semiMajor:   R,
    halfExtentX: R * 2.8,
    halfExtentY: R * 1.4,
});

// ─────────────────────────────────────────────────────────────────────
// Пользовательская полиномиальная проекция (коэффициенты bb[] и aa[])
// ─────────────────────────────────────────────────────────────────────
(function registerCustomPolynomial() {
    const bb = [
        52.81, -0.035186, 0.033369, -0.016102, 0.0029195, -0.000004,
        -0.0079884, 0.0053805, 0.035531, -12.72, 1.5086, -1.9888,
        0.26824, 0.12153, 0.061294, -0.41449, 0.18542, 0.099726,
        -0.049223, -0.050489, 0.0064187, -0.0025242,
    ];
    const aa = [
        63.354, 0.065299, 2.1814, 0.021535, 0.0029811, -0.0037641,
        0.000832, -0.0000633, 0.055675, 2.7757, 0.0274, -0.078446,
        0.048269, 0.048869, -0.6516, -0.014802, -0.016348, 0.001497,
        0.0015999, 0.0011988,
    ];

    const K        = 100000;
    const D2R      = Math.PI / 180;
    const R2D      = 180 / Math.PI;
    const PI       = Math.PI;
    const HALF_PI  = Math.PI / 2;
    const EPS      = 1e-12;
    const MAX_ITER = 50;

    function P(L, F) {
        return bb[0] + bb[1]*L + bb[2]*L*L + bb[3]*L*L*L
             + L*L*L*L*(bb[4] + bb[5]*L)
             + L*F*(bb[13] + bb[14]*F + bb[15]*F*F + bb[16]*F**3
                    + bb[17]*F**4 + bb[18]*F**5)
             + F*(bb[8] + bb[9]*F + bb[10]*F*F + bb[11]*F**3 + bb[12]*F**4)
             + L*L*F*(bb[19] + bb[6]*F + bb[20]*L + bb[7]*F*L + bb[21]*L*L);
    }
    function Q(L, F) {
        return aa[0] + aa[1]*L + aa[2]*L*L
             + L**3*(aa[3] + aa[4]*L + aa[5]*L**2 + aa[6]*L**3 + aa[7]*L**4)
             + aa[8]*F + aa[9]*F*F + aa[10]*F**3
             + L*F*(aa[11] + aa[12]*F + aa[16]*F*F + aa[18]*F**3)
             + L*L*F*(aa[13] + aa[14]*F)
             + L**3*F*(aa[15] + aa[19]*F + aa[17]*L);
    }
    function PL(L, F) {
        return bb[1] + 2*bb[2]*L + 3*bb[3]*L*L
             + 4*bb[4]*L**3 + 5*bb[5]*L**4
             + F*(bb[13] + bb[14]*F + bb[15]*F*F + bb[16]*F**3
                  + bb[17]*F**4 + bb[18]*F**5)
             + 2*bb[19]*L*F + 2*bb[6]*L*F*F
             + 3*bb[20]*L*L*F + 3*bb[7]*L*L*F*F + 4*bb[21]*L**3*F;
    }
    function PF(L, F) {
        return L*(bb[13] + 2*bb[14]*F + 3*bb[15]*F*F + 4*bb[16]*F**3
                  + 5*bb[17]*F**4 + 6*bb[18]*F**5)
             + bb[8] + 2*bb[9]*F + 3*bb[10]*F*F + 4*bb[11]*F**3 + 5*bb[12]*F**4
             + bb[19]*L*L + 2*bb[6]*L*L*F
             + bb[20]*L**3 + 2*bb[7]*L**3*F + bb[21]*L**4;
    }
    function QL(L, F) {
        return aa[1] + 2*aa[2]*L + 3*aa[3]*L*L + 4*aa[4]*L**3
             + 5*aa[5]*L**4 + 6*aa[6]*L**5 + 7*aa[7]*L**6
             + F*(aa[11] + aa[12]*F + aa[16]*F*F + aa[18]*F**3)
             + 2*aa[13]*L*F + 2*aa[14]*L*F*F
             + 3*aa[15]*L*L*F + 3*aa[19]*L*L*F*F + 4*aa[17]*L**3*F;
    }
    function QF(L, F) {
        return aa[8] + 2*aa[9]*F + 3*aa[10]*F*F
             + L*(aa[11] + 2*aa[12]*F + 3*aa[16]*F*F + 4*aa[18]*F**3)
             + aa[13]*L*L + 2*aa[14]*L*L*F
             + aa[15]*L**3 + 2*aa[19]*L**3*F + aa[17]*L**4;
    }

    function makeProjection(lon0, scaleA, scaleB, swap) {
        function forward(latDeg, lonDeg) {
            const L = Math.abs(lonDeg - lon0) * D2R;
            const F = Math.abs(latDeg)        * D2R;
            const y0 = L * P(L, F) * K * scaleB;
            const x0 = F * Q(L, F) * K * scaleA;
            const yF = lonDeg < lon0 ? -y0 : y0;
            const xF = latDeg < 0    ? -x0 : x0;
            return swap ? [yF, xF] : [xF, yF];
        }
function inverse(x, y) {
    const xF = swap ? y : x;
    const yF = swap ? x : y;
    const Y0 = Math.abs(yF) / (K * scaleB);
    const X0 = Math.abs(xF) / (K * scaleA);

    // Несколько стартовых точек, покрывающих домен [0,π] × [0,π/2].
    // Идея: где-то среди них окажется та же "ветвь", что и настоящая,
    // и Ньютон сойдётся именно к ней.
    const seeds = [
        [Y0 / bb[0],            X0 / aa[0]],           // линейное приближение
        [Math.PI / 4,           Math.PI / 4],          // середина
        [Math.PI / 2,           Math.PI / 4],
        [Math.PI / 4,           Math.PI / 2],
        [Math.PI / 2,           Math.PI / 2],
        [3 * Math.PI / 4,       Math.PI / 2],
        [Math.PI,               Math.PI / 2],          // угловой случай (полюс+антимеридиан)
        [Math.PI,               Math.PI / 4],
        [Math.PI / 2,           0.1],
        [0.1,                   Math.PI / 2],
    ];

    let bestL = 0, bestF = 0, bestRes = Infinity;
    for (const [L0, F0] of seeds) {
        const r = newtonBounded(L0, F0, Y0, X0);
        if (r.residual < bestRes) {
            bestRes = r.residual;
            bestL = r.L;
            bestF = r.F;
        }
    }

    // Страховка: если даже лучший residual большой — сообщаем через NaN,
    // чтобы вызывающий код/таблица увидели проблему, а не «ложный успех».
    const RESIDUAL_TOL = 1e-3; // единицы X0/Y0 (≈ 100 м в исходных координатах)
    if (!isFinite(bestRes) || bestRes > RESIDUAL_TOL) {
        // Возвращаем хоть что-то осмысленное (не NaN), но помечаем —
        // в вашей таблице это будет видно по большому Δmax.
    }

    const latDeg = (xF < 0 ? -bestF : xF > 0 ? bestF : 0) * R2D;
    const lonDeg = lon0 + (yF < 0 ? -bestL : yF > 0 ? bestL : 0) * R2D;

    // Нормализуем долготу в [-180, 180] (на случай выхода за границы домена)
    let lon = lonDeg;
    while (lon >  180) lon -= 360;
    while (lon < -180) lon += 360;

    // Широту — в [-90, 90]
    const lat = Math.max(-90, Math.min(90, latDeg));
    return [lat, lon];
}

/**
 * Ньютон с жёстким удержанием в [0, π] × [0, π/2].
 * Возвращает { L, F, residual } — остаток от последнего шага.
 */
function newtonBounded(L, F, Y0, X0) {
    L = Math.max(0, Math.min(PI, L));
    F = Math.max(0, Math.min(HALF_PI, F));

    let bestResidual = Infinity;
    let bestL = L, bestF = F;

    for (let i = 0; i < MAX_ITER; i++) {
        const p  = P (L, F), q  = Q (L, F);
        const pL = PL(L, F), pF = PF(L, F);
        const qL = QL(L, F), qF = QF(L, F);
        const H1 = L * p - Y0;
        const H2 = F * q - X0;
        const residual = H1 * H1 + H2 * H2;

        if (residual < bestResidual) {
            bestResidual = residual;
            bestL = L;
            bestF = F;
        }

        const J11 = p + L * pL, J12 = L * pF;
        const J21 = F * qL,     J22 = q + F * qF;
        const det = J11 * J22 - J12 * J21;
        if (Math.abs(det) < 1e-30) break;

        const dL = (H1 * J22 - J12 * H2) / det;
        const dF = (J11 * H2 - H1 * J21) / det;

        L -= dL;
        F -= dF;

        // Жёсткое удержание в домене — ключевое отличие от старого кода.
        if (L < 0)       L = 0;
        if (L > PI)      L = PI;
        if (F < 0)       F = 0;
        if (F > HALF_PI) F = HALF_PI;

        if (Math.max(Math.abs(dL), Math.abs(dF)) < EPS) break;
    }

    // Финальный учёт
    const p = P(L, F), q = Q(L, F);
    const H1 = L * p - Y0;
    const H2 = F * q - X0;
    const res = H1 * H1 + H2 * H2;
    if (res < bestResidual) {
        bestResidual = res;
        bestL = L;
        bestF = F;
    }
    return { L: bestL, F: bestF, residual: bestResidual };
}
return { forward, inverse };
}   

    const LON0      = 0;
    const SCALE_A   = 1;
    const SCALE_B   = 1;
    const SWAP_AXES = true;

    const { forward, inverse } = makeProjection(LON0, SCALE_A, SCALE_B, SWAP_AXES);

    let maxX = 0, maxY = 0;
    for (let lat = -90; lat <= 90; lat += 5) {
        for (let lon = -180; lon <= 180; lon += 5) {
            const L = Math.abs(lon - LON0) * D2R;
            const F = Math.abs(lat)        * D2R;
            if (L > PI + 1e-6 || F > HALF_PI + 1e-6) continue;
            const [x, y] = forward(lat, lon);
            if (Number.isFinite(x)) maxX = Math.max(maxX, Math.abs(x));
            if (Number.isFinite(y)) maxY = Math.max(maxY, Math.abs(y));
        }
    }
    const HALF_X = (maxX || 2e7) * 1.15;
    const HALF_Y = (maxY || 2e7) * 1.15;

    KRB.Projections.registerFormula('TEST:POLY', [
        (lat, lon) => forward(lat, lon)[0],
        (lat, lon) => forward(lat, lon)[1],
        (x, y)     => inverse(x, y)[0],
        (x, y)     => inverse(x, y)[1],
    ], {
        semiMajor:   6_371_000,
        halfExtentX: HALF_X,
        halfExtentY: HALF_Y,
        maxAbsCoord: Math.max(HALF_X, HALF_Y) * 1.5,
        wrapsLongitude: false,
    });

    console.log('[TEST:POLY] halfExtent =', HALF_X.toFixed(0), '×', HALF_Y.toFixed(0),
                '| lon0 =', LON0, '| swap =', SWAP_AXES);
})();

// ─────────────────────────────────────────────────────────────────────
// 2. ПОЛЬЗОВАТЕЛЬСКАЯ ПРОЕКЦИЯ (компилятор формул)
// ─────────────────────────────────────────────────────────────────────
const CUSTOM_CODE_PREFIX = 'TEST:CUSTOM:';
let customVersion = 0;

/**
 * Компилирует строку-формулу в функцию.
 * Если содержит `return` — трактуется как тело функции,
 * иначе — как выражение (оборачивается в `return (...)`).
 *
 * @param {string} code
 * @param {string[]} argNames — имена аргументов (lat, lon) / (x, y)
 * @returns {(...args) => any}
 */
function compileFormula(code, argNames) {
    const trimmed = (code || '').trim();
    if (!trimmed) throw new Error('пустая формула');

    const scope = {
        R, D2R, R2D,
        PI: Math.PI,
        HALF_PI: Math.PI / 2,
    };
    const scopeNames  = Object.keys(scope);
    const scopeValues = Object.values(scope);

    let raw;
    try {
        if (/\breturn\b/.test(trimmed)) {
            raw = new Function(...scopeNames, ...argNames, trimmed);
        } else {
            raw = new Function(...scopeNames, ...argNames, `return (${trimmed});`);
        }
    } catch (e) {
        throw new Error('синтаксическая ошибка: ' + e.message);
    }
    return (...args) => raw(...scopeValues, ...args);
}

/**
 * Читает поля, компилирует, регистрирует под новым кодом TEST:CUSTOM:N.
 * Возвращает код зарегистрированной проекции.
 */
function buildCustomProjection() {
    const fwdCode = document.getElementById('fwd-formula').value;
    const invCode = document.getElementById('inv-formula').value;
    const heX = parseFloat(document.getElementById('he-x').value);
    const heY = parseFloat(document.getElementById('he-y').value);

    const fwd = compileFormula(fwdCode, ['lat', 'lon']);
    const inv = compileFormula(invCode, ['x', 'y']);

    // быстрый smoke-test
    const t1 = fwd(0, 0);
    if (!Array.isArray(t1) || t1.length < 2 ||
        !Number.isFinite(t1[0]) || !Number.isFinite(t1[1])) {
        throw new Error('forward должна вернуть [x, y] (числа)');
    }
    const t2 = inv(0, 0);
    if (!Array.isArray(t2) || t2.length < 2 ||
        !Number.isFinite(t2[0]) || !Number.isFinite(t2[1])) {
        throw new Error('inverse должна вернуть [lat, lon] (числа)');
    }

    const hx = Number.isFinite(heX) ? heX : 180;
    const hy = Number.isFinite(heY) ? heY : 90;
    const code = CUSTOM_CODE_PREFIX + (++customVersion);

    KRB.Projections.registerFormula(code, [
        (lat, lon) => { const r = fwd(lat, lon); return r[0]; },
        (lat, lon) => { const r = fwd(lat, lon); return r[1]; },
        (x, y)     => { const r = inv(x, y);   return r[0]; },
        (x, y)     => { const r = inv(x, y);   return r[1]; },
    ], {
        semiMajor:   R,
        halfExtentX: hx,
        halfExtentY: hy,
        maxAbsCoord: Math.max(Math.abs(hx), Math.abs(hy), 1) * 1.5,
        wrapsLongitude: false,
    });

    // сохраняем в localStorage для удобства
    try {
        localStorage.setItem('customProj', JSON.stringify({
            fwd: fwdCode, inv: invCode, heX: hx, heY: hy,
        }));
    } catch (_) { /* ignore */ }

    return code;
}

// восстановление из localStorage
try {
    const saved = JSON.parse(localStorage.getItem('customProj') || '{}');
    if (typeof saved.fwd === 'string') document.getElementById('fwd-formula').value = saved.fwd;
    if (typeof saved.inv === 'string') document.getElementById('inv-formula').value = saved.inv;
    if (Number.isFinite(saved.heX))    document.getElementById('he-x').value = saved.heX;
    if (Number.isFinite(saved.heY))    document.getElementById('he-y').value = saved.heY;
} catch (_) { /* ignore */ }

// ─────────────────────────────────────────────────────────────────────
// 3. КАРТА И ПЕРЕКЛЮЧЕНИЕ CRS
// ─────────────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
let current = null;
let geojsonCache = null;

async function loadGeojson() {
    if (geojsonCache) return geojsonCache;
    statusEl.textContent = 'загрузка world.geojson…';
    const r = await fetch('./world.geojson');
    if (!r.ok) throw new Error(`HTTP ${r.status} для world.geojson`);
    geojsonCache = await r.json();
    return geojsonCache;
}

async function show(crs) {
    if (current) { current.map.dispose(); current = null; }

    const isCustom = typeof crs === 'string' && crs.startsWith(CUSTOM_CODE_PREFIX);
    const label = isCustom ? 'CUSTOM' : crs;

    document.querySelectorAll('#ui button').forEach(b => {
        const bc = b.dataset.crs;
        const match = (bc === crs) || (isCustom && bc === 'TEST:CUSTOM');
        b.classList.toggle('active', match);
    });
    statusEl.textContent = `создание карты в ${label}…`;

    if (typeof crs === 'string' && KRB.Projections?.ensure) {
        await KRB.Projections.ensure(crs);
    }

    const map = new KRB.Map({
        target: 'map',
        crs,
        layers: [],
        graticule: {
        crs: 'EPSG:4326',
        step: 15,
        color: '#888',
        width: 1,
        opacity: 0.6,
        showLabels: true,
    },
        view: new KRB.View({
            centerLonLat: [10, 20],
            zoom: 1,
            minZoom: 0,
            maxZoom: 8,
        }),
    });

    console.log(`[${label}] projection =`, map.projection);
    console.log(`[${label}] halfExtentX =`, map.projection.halfExtentX,
                `halfExtentY =`, map.projection.halfExtentY);

    const data = await loadGeojson();

    const layer = new KRB.GeoJSONLayer({
        data,
        defaultFillColor:   '#3b82f6',
        defaultFillOpacity: 0.28,
        defaultStrokeColor: '#1e3a8a',
        defaultStrokeWidth: 0.7,
    });
    layer.addTo(map);

    current = { map, layer };
    statusEl.textContent = `готово: ${label}`;
}

function applyCustomAndShow() {
    try {
        const code = buildCustomProjection();
        show(code).catch(err => {
            console.error(err);
            statusEl.textContent = 'ошибка: ' + err.message;
        });
    } catch (err) {
        console.error(err);
        statusEl.textContent = 'ошибка формулы: ' + err.message;
    }
}

document.getElementById('ui').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-crs]');
    if (!btn) return;
    if (btn.dataset.crs === 'TEST:CUSTOM') {
        applyCustomAndShow();
        return;
    }
    show(btn.dataset.crs).catch(err => {
        console.error(err);
        statusEl.textContent = 'ошибка: ' + err.message;
    });
});

show('EPSG:3857').catch(err => {
    console.error(err);
    statusEl.textContent = 'ошибка: ' + err.message;
});


</script>
