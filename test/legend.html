<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Diagram — Локализованные диаграммы + Легенды</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    /* панель легенд поверх карты */
    #legends {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 240px;
        font: 13px/1.35 system-ui, sans-serif;
    }
    .legend-card {
        background: #fff;
        border: 1px solid #ddd;
        padding: 10px 12px;
    }
    .legend-card:empty { display: none; }
    .legend-card h3 {
        margin: 0 0 8px;
        font-size: 13px;
    }

    /* строка легенды: свотч + подпись */
    .legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
    }
    .legend-row:last-child { margin-bottom: 0; }

    .legend-swatch {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border: 1px solid rgba(0, 0, 0, 0.15);
        box-sizing: border-box;
    }

    /* пример диаграммы */
    .legend-example {
        text-align: center;
        padding: 8px 0;
        margin-bottom: 8px;
        border-bottom: 1px solid #eee;
    }
    .legend-example canvas { display: block; margin: 0 auto; }

    .legend-footer {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #eee;
        color: #666;
        font-size: 12px;
    }
</style>
</head>
<body>
<div id="map"></div>

<div id="legends">
    <div class="legend-card" id="legend-choropleth"></div>
    <div class="legend-card" id="legend-diagram"></div>
</div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs(['ADPKP:0057']);

const map = new KRB.Map({
    target: 'map',
    crs: 'ADPKP:0057',
    graticule: { crs: 'EPSG:4326', step: 15, color: '#888', width: 1 },
    view: new KRB.View({
        centerLonLat: [10, 20],
        zoom: 2, minZoom: 0, maxZoom: 8,
    }),
});


new KRB.GeoJSONLayer({
    url: 'world.geojson',
    crs: 'EPSG:4326',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Население: ${p.pop}`,
    style: { polygon: { default: { title: '' } } },

   choropleth: {
        value: 'score',
        classification: 'arithmetic', 
        colorRamp: 'Purples',
        colorRampInvert: true,
        noDataColor: '#cccccc',
        pretty: true,

        legend: {
            target: 'legend-choropleth',
            title: 'Население, чел.',
            template: `
                <h3>{{title}}</h3>
                {{#each classes}}
                    <div class="legend-row">
                        <span class="legend-swatch" style="background:{{color}}"></span>
                        <span>{{label}}</span>
                    </div>
                {{/each}}
            `,
        },
    },

}).addTo(map);

// ─────────────────────────────────────────────────────────────────
// СЛОЙ 2: Точки с диаграммами — тот же #each classes
// ─────────────────────────────────────────────────────────────────
const cities = [
    { name: 'Москва',   lon: 37.61,  lat: 55.75 },
    { name: 'Лондон',   lon: -0.12,  lat: 51.50 },
    { name: 'Нью-Йорк', lon: -74.00, lat: 40.71 },
    { name: 'Токио',    lon: 139.69, lat: 35.68 },
    { name: 'Сидней',   lon: 151.20, lat: -33.86 },
    { name: 'Каир',     lon: 31.23,  lat: 30.04 },
    { name: 'Рио',      lon: -43.17, lat: -22.90 },
    { name: 'Кейптаун', lon: 18.42,  lat: -33.92 },
    { name: 'Дели',     lon: 77.20,  lat: 28.61 },
    { name: 'Пекин',    lon: 116.40, lat: 39.90 },
];

const pointsFeatures = [];
for (let i = 0; i < 40; i++) {
    const c = cities[Math.floor(Math.random() * cities.length)];
    pointsFeatures.push({
        type: 'Feature',
        geometry: {
            type: 'Point',
            coordinates: [
                c.lon + (Math.random() - 0.5) * 5,
                c.lat + (Math.random() - 0.5) * 5,
            ],
        },
        properties: {
            name:  `${c.name} ${i}`,
            score: Math.floor(Math.random() * 500) + 10,
            value: Math.floor(Math.random() * 300) + 10,
            count: Math.floor(Math.random() * 100) + 1,
        },
    });
}

new KRB.GeoJSONLayer({
    data: { type: 'FeatureCollection', features: pointsFeatures },
    crs: 'EPSG:4326',
    tooltipOnHover: true,
    tooltip: (p) => `<b>${p.name}</b><br>Score: ${p.score}<br>Value: ${p.value}<br>Count: ${p.count}`,

    diagram: {
        type: 'vienna',
        fields: ['score', 'value', 'count'],
        colorMap: {
            score: '#e74c3c',
            value: '#3498db',
            count: '#2ecc71',
        },
        unitPx: 10,
        gap: 2,
        unitValue: 100,
        strokeColor: '#fff',
        strokeWidth: 1,
        minZoom: 1,

        legend: {
            target: 'legend-diagram',
            title: 'Городская статистика',
            example: 'auto',
            template: `
                <h3>{{title}}</h3>
                <div class="legend-example">{{example}}</div>
                {{#each classes}}
                    <div class="legend-row">
                        <span class="legend-swatch" style="background:{{color}}"></span>
                        <span>{{label}}</span>
                    </div>
                {{/each}}
                <div class="legend-footer">Один кубик ≈ {{unitValue}} ед.</div>
            `,
        },
    },
}).addTo(map);
</script>
</body>
</html>
