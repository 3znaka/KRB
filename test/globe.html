<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Geotiff</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.crs.add('EPSG:32637');


const map = new KRB.Map({
    target: 'map',
    debug: true,
globe: true,
    layers: [
        new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/',
          //  elevation: 'demo',
            maxZoom: 18
        })
    ],
    view: new KRB.View({
       centerLonLat: [37.6178, 55.7558],
        zoom: 8,
        maxZoom: 18
    }),
});

new KRB.Marker({
    position: [37.6178, 55.7558],
    tooltip: '<b>Москва</b><br><small>столица России</small>',
    title: 'Москва',
    titleStyle: { color: '#fff', textShadow: '0 1px 3px #000', fontSize: '13px', fontWeight: 'bold' }
}).addTo(map);




  const world = new KRB.GeoJSONLayer({
        url: 'world.geojson',
        //extendAntarctica: true,
        defaultFillColor:   '#aa0101',
       // Отключаем подписи стран, чтобы не мешали
    style: { polygon: { default: { title: '' } } },
        defaultStrokeColor: '#000000',
        defaultStrokeWidth: 0.3,
    }).addTo(map);


window.map = map; 

</script>
</body>
</html>
