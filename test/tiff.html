<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Geotiff</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        width: 100%; height: 100dvh; overflow: hidden;
    }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';

await KRB.addCrs(['ADPKP:0057']);

const map = new KRB.Map({
    target: 'map',
crs: 'ADPKP:0057',
    layers: [
        new KRB.Tile({ texture: 'demo' })
    ],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 10,
        pitch: 55
    }),
    debug: true,
});
window.map = map; 
 new KRB.GeoTiffLayer({
    source: 'bratkov.tif',
heightScale: 10000,
 asElevation: true,
    colorRamp: 'terrain',
    opacity: 0.75,
    onLoad: (layer) => {
        const b = layer.getBounds();
        if (b) map.fitToBounds(b, { duration: 1.0, padding: 40 });
    }
}).addTo(map);

</script>
</body>
</html>
