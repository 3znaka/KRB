<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link href="../KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as KRB from '../js/KRB.js';


const map = new KRB.Map({
    target: 'map',
    layers: [],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558],
        zoom: 12,
        maxZoom: 22
    }),

});

map.moveCameraTo(37.6178, 55.7558);

const vectorLayer = new KRB.VectorTile({
    url: 'https://storage.mwsapis.ru/b-winzaf/pbf/{z}/{x}/{y}.pbf',
    maxNativeZoom: 14,                     // тайлы до 14-го уровня, дальше растягиваются
    minZoom: 2,                            // показываем с 2-го зума
    maxZoom: 22,
                    zoomOffset: -2
}).addTo(map);

const myModel = new KRB.Marker3D({
    position: [37.662, 55.764],
    modelUrl: 'model.glb',
    size: 200,                   
    altitude: 0,
    altitudeMode: 'clampToGround',
    anchor: [0.5, 0, 0.5],
    onHover: (hovered) => {
        if (hovered) {
            myModel.animateSize(300, 500, 'easeOut');
        } else {
            myModel.animateSize(200, 500, 'easeIn');
        }
    }
});
myModel.addTo(map);


</script>
</body>
</html>
