<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Geotiff ECEF Test</title>
<link href="../KRB.css" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; left: 0; right: 0; top: 0; bottom: 0; width: 100%; height: 100dvh; overflow: hidden; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as KRB from '../js/KRB.js';


await KRB.Projections.addCrs('EPSG:4978');

const map = new KRB.Map({
    target: 'map',
    globe: true,
    layers: [
        new KRB.Tile({
            texture: 'https://tile0.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1&ts=online_sd',
            attributionTitle: '2GIS',
            attributionUrl: 'https://2gis.ru/',
        })
    ],
    view: new KRB.View({
        centerLonLat: [37.6178, 55.7558], // Москва
        zoom: 4, // Уменьшил зум, чтобы было видно всю точку
        maxZoom: 18
    }),
    debug: true,
});

// 2. Ваши ECEF координаты (X, Y, Z)
const ecefCoord = [2517606.5420, 1992977.2560, 5492599.8500];

// 3. Конвертируем их в геодезические (lon, lat, h)
const geodetic = KRB.ecefToGeodetic(
    ecefCoord[0], 
    ecefCoord[1], 
    ecefCoord[2], 
    KRB.ELLIPSOIDS.wgs84 // Теперь это сработает, так как импортировано напрямую
);

console.log('Конвертированная точка:', geodetic); 



// 5. Marker 2: Прямой ECEF (синтаксический сахар, который мы добавили в Marker.ts)
// Убедитесь, что вы добавили блок "умного перехвата" в конструктор Marker.ts, как я описывал ранее
const marker2 = new KRB.Marker3D({
    position: ecefCoord, // Просто передаем [X, Y, Z]
    crs: 'EPSG:4978',
    title: 'ECEF-точка (авто-конвертация)'
});

marker2.addTo(map);

const msk = KRB.geodeticToEcef(37.6178, 55.7558, 500, KRB.ELLIPSOIDS.wgs84);
const spb = KRB.geodeticToEcef(30.3141, 59.9386, 500, KRB.ELLIPSOIDS.wgs84);

const line = new KRB.Vector3D({
    positions: [
        [msk.X, msk.Y, msk.Z],
        [spb.X, spb.Y, spb.Z],
    ],
    crs: 'EPSG:4978',
    color: '#ff5533',
    width: 3,
    altitudeMode: 'absolute',
    altitude: 0,
});
line.addTo(map);

const corners = [
    [37.6170, 55.7550], [37.6186, 55.7550],
    [37.6186, 55.7562], [37.6170, 55.7562],
    [37.6170, 55.7550], // замыкающая
].map(([lon, lat]) => {
    const e = KRB.geodeticToEcef(lon, lat, 30, KRB.ELLIPSOIDS.wgs84);
    return [e.X, e.Y, e.Z];
});

const area = new KRB.Area3D({
    rings: [corners],
    crs: 'EPSG:4978',
    primitiveType: 'box',
    fit: 'stretch',
    size: [1, 25, 1],   // высота бокса 25 м
    altitudeMode: 'absolute',
    title: 'КОРОБКА',
    altitude: 0,
});
area.addTo(map);

console.log(area.getBounds());  // честные [[37.617, 55.755], [37.6186, 55.7562]]
console.log(area.getRings());  

const ringLonLat = [
    [37.6170, 55.756],
    [37.6186, 55.7550],
    [37.6186, 55.7562],
    [37.6170, 55.7562],
    [37.6170, 55.7550],
];

const ringEcef = ringLonLat.map(([lon, lat]) => {
    const e = KRB.geodeticToEcef(lon, lat, 30, KRB.ELLIPSOIDS.wgs84);
    return [e.X, e.Y, e.Z];
});

const polygon = new KRB.Polygon({
    rings: [ringEcef],
    crs: 'EPSG:4978',

    fillColor: '#ff5533',
    fillOpacity: 0.4,

    extruded: true,
    height: 20,

    altitudeMode: 'absolute',
    altitude: 0,
});

polygon.addTo(map);

const toEcef = (lon, lat, h) => {
    const e = KRB.geodeticToEcef(lon, lat, h, KRB.ELLIPSOIDS.wgs84);
    return [e.X, e.Y, e.Z];
};


// Режим nodes: quad по ECEF-узлам с высотой 50 м
const img1 = new KRB.Image({
    source: 'horse.png',
    crs: 'EPSG:4978',
    nodes: [
        toEcef(37.6170, 55.7562, 50),
        toEcef(37.6186, 55.7562, 50),
        toEcef(37.6170, 55.7550, 50),
        toEcef(37.6186, 55.7550, 50),
    ],
});
img1.addTo(map);

// Режим position: центр по ECEF + размер в world-метрах
const img2 = new KRB.Image({
    source: 'horse.png',
    crs: 'EPSG:4978',
    title: 'лошадь',
    position: toEcef(37.6178, 55.7558, 80),
    size: [200, 200],
});
img2.addTo(map);


window.map = map; 
</script>
</body>
</html>
