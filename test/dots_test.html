<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>GeoTiffLayer — точечный способ</title>
    <link href="../KRB.css" rel="stylesheet">
    <style>
        body { margin:0; overflow:hidden; font:13px sans-serif; }
        #map { width:100%; height:100dvh; touch-action:none; position:relative; }
        #panel {
            position:fixed; top:8px; right:8px; z-index:1000; background:rgba(255,255,255,0.94);
            padding:8px 10px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.3); width:280px;
        }
        #panel label { display:block; margin:6px 0 2px; }
        #panel input { width:100%; box-sizing:border-box; }
        #status { margin-top:8px; color:#222; white-space:pre-wrap; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <b>Точечный способ (mode: dots)</b>
    <label>GeoTIFF (одноканальный, с числовыми значениями)</label>
    <input id="file" type="file" accept=".tif,.tiff">
    <label>Вес точки (единиц явления на точку)</label>
    <input id="weight" type="number" value="100" min="0.001" step="any">
    <label>Цвет точек</label>
    <input id="color" type="color" value="#e0443a">
    <label>Размер точки, px</label>
    <input id="size" type="range" min="1" max="10" step="0.5" value="4">
    <div id="status">Выберите GeoTIFF</div>
</div>
<script type="module">
import * as KRB from '../js/KRB.js';

const map = new KRB.Map({
    target: 'map',
    layers: [new KRB.Tile({ texture: 'demo', heightScale: 2.0 })],
    view: new KRB.View({ centerLonLat: [38.37, 59.69], zoom: 10, pitch: 40 })
});

const status = document.getElementById('status');
let layer = null;

function dotParams() {
    return {
        weight: Number(document.getElementById('weight').value),
        color: document.getElementById('color').value,
        size: Number(document.getElementById('size').value),
    };
}

async function load(file) {
    if (layer) layer.remove();
    status.textContent = 'Чтение растра…';
    try {
        const url = URL.createObjectURL(file);
        layer = new KRB.GeoTiffLayer({
            source: url,
            mode: ['color','dots'],
            dotParams: dotParams(),
            onLoad: () => { status.textContent = `Точки построены. Вес ${dotParams().weight}.`; },
            onError: (e) => { status.textContent = 'Ошибка: ' + (e && e.message ? e.message : e); },
        });
        layer.addTo(map);
    } catch (e) {
        status.textContent = 'Ошибка: ' + e.message;
    }
}

document.getElementById('file').addEventListener('change', (e) => {
    if (e.target.files[0]) load(e.target.files[0]);
});
</script>
</body>
</html>
